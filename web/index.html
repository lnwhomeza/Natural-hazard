<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผ่นดินทรุด กรุงเทพฯ–ปริมณฑล | Bangkok Land Subsidence</title>
<meta name="description" content="แผนที่อัตราการทรุดตัวของแผ่นดิน กรุงเทพฯ สมุทรปราการ สมุทรสาคร จากดาวเทียม Sentinel-1 พ.ศ. 2564–2569">
<meta property="og:title" content="แผ่นดินตรงบ้านคุณทรุดลงปีละเท่าไร">
<meta property="og:description" content="อัตราการทรุดตัวของแผ่นดิน กรุงเทพฯ สมุทรปราการ สมุทรสาคร จากดาวเทียม Sentinel-1 เม.ย. 2564 – ต.ค. 2569 ค้นหาบ้านของคุณได้">
<meta property="og:image" content="https://lnwhomeza.github.io/Natural-hazard/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://lnwhomeza.github.io/Natural-hazard/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* โทนจากไม้สต๊าฟวัดระดับ (แดง/ขาว) และหมึกเข้มของแผนที่สำรวจ */
  :root {
    --paper: #fcfdfd; --ink: #1b2629; --muted: #56666b; --rule: #d3dbdc; --wash: #eef2f2;
    --staff: #c41e24; --flood: #2166ac; --gfm: #e84c78;
    --shadow: 0 2px 10px rgba(27, 38, 41, .14);
    --head: "Chakra Petch", "Anuphan", system-ui, sans-serif;
    --body: "Anuphan", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121a1c; --ink: #e6edee; --muted: #9aabaf; --rule: #2a3639; --wash: #1a2427;
      --staff: #f0544f; --shadow: 0 2px 14px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #121a1c; --ink: #e6edee; --muted: #9aabaf; --rule: #2a3639; --wash: #1a2427;
    --staff: #f0544f; --shadow: 0 2px 14px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
  #map { position: absolute; inset: 0; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--staff); outline-offset: 2px; }

  .panel { position: absolute; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); }

  /* ---- แผงด้านซ้าย ---- */
  #side { top: 12px; left: 12px; width: 344px; max-height: calc(100% - 24px); overflow: auto; padding: 14px 18px 16px; }
  .topline { display: flex; justify-content: flex-end; align-items: baseline; font-size: 13.5px; margin-bottom: 10px; }
  .topline .place { color: var(--muted); }
  .link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); text-decoration: underline;
    text-decoration-color: var(--rule); text-underline-offset: 3px; }
  .link:hover { text-decoration-color: var(--staff); }
  .topline .links { display: flex; gap: 14px; }
  h1 { font: 600 24px/1.2 var(--head); margin: 0 0 8px; letter-spacing: -.005em; }
  .lede { margin: 0 0 14px; font-size: 14.5px; }
  .lede b { font-family: var(--head); font-weight: 600; color: var(--staff); }

  #search { display: flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
  #search input { flex: 1; min-width: 0; border: 0; padding: 9px 11px; background: var(--paper); font-size: 15px; }
  #search input:focus { outline: none; }
  #search:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--staff) 25%, transparent); }
  #search button { border: 0; background: var(--ink); color: var(--paper); padding: 0 14px; cursor: pointer; font-weight: 500; }
  #results { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--rule); border-radius: 6px; max-height: 210px; overflow: auto; }
  #results li button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 11px; cursor: pointer; font-size: 14px; }
  #results li button:hover, #results li button:focus-visible { background: var(--wash); }
  #results li small { color: var(--muted); }
  #results .msg { padding: 7px 11px; font-size: 14px; color: var(--muted); }

  .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); margin: 18px 0 10px; border: 1px solid var(--rule); border-radius: 6px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 500; }

  /* สัญลักษณ์แบบไม้บรรทัด/ไม้สต๊าฟ */
  .scale-t { font-size: 13.5px; margin: 0 0 6px; }
  .ruler { position: relative; display: grid; height: 16px; border-radius: 2px; overflow: hidden; }
  .ruler span { display: block; }
  .ticks { position: relative; height: 22px; font: 500 12.5px/1 var(--head); color: var(--muted); font-variant-numeric: tabular-nums; }
  .ticks span { position: absolute; top: 0; padding-top: 5px; transform: translateX(-50%); border-left: 1px solid var(--muted); }
  .ticks span::before { content: ""; position: absolute; left: -1px; top: 0; height: 4px; border-left: 1px solid var(--muted); }
  .ticks span { border-left: 0; }
  .ticks span.end { transform: translateX(-100%); }
  .ticks span.end::before { left: auto; right: 0; }
  .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .nod { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .nod i { width: 16px; height: 10px; background: #c8c8c8; border-radius: 2px; }

  #slrCtl { margin: 4px 0 6px; }
  #riskCtl .seg { margin: 0 0 10px; }
  .seg4 button { font-size: 13px; padding: 5px 2px; }
  .fx { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 13.5px; }
  .fx-eq { font: 600 15px/1.5 var(--head); margin: 0 0 8px; }
  .fx-eq { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 14px; }
  .fx-eq span { padding: 1px 5px; border-radius: 4px; color: var(--muted); white-space: nowrap; }
  .fx-eq span.on { color: var(--paper); }
  .fx h4 { font: 600 14px/1.3 var(--head); margin: 8px 0 4px; }
  .fx ul { margin: 0; padding-left: 18px; }
  .fx li { margin: 2px 0; }
  .fx li small { color: var(--muted); display: block; }
  .fx details { margin-top: 8px; }
  .fx details p, .fx details li { color: var(--muted); }
  .fx code { font-family: var(--head); font-weight: 600; color: var(--ink); }
  #slrCtl .seg { margin: 0 0 8px; }
  #slrCtl .seg button:disabled { opacity: .35; cursor: default; }
  .ctl-l { font-size: 12.5px; color: var(--muted); margin: 2px 0 3px; }
  #slrCtl .seg button { font-size: 13px; padding: 5px 4px; }
  .yr { display: flex; align-items: center; gap: 10px; }
  .yr input { flex: 1; accent-color: var(--ink); }
  .yr output { font: 600 18px/1 var(--head); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
  .swl { display: grid; grid-template-columns: 16px 1fr; gap: 6px 8px; align-items: center; font-size: 13.5px; margin-top: 8px; }
  .swl i { width: 16px; height: 12px; border-radius: 2px; }
  .slr-sum { font-size: 13.5px; margin: 8px 0 0; color: var(--muted); }
  .slr-sum b { color: var(--ink); font-family: var(--head); }
  label.chk { display: flex; align-items: center; gap: 10px; margin: 7px 0; cursor: pointer; font-size: 14px; }
  label.chk input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
  .sw { width: 16px; height: 10px; border-radius: 2px; flex: none; }
  .flood-row { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--rule); }
  details { margin-top: 6px; }
  summary { cursor: pointer; font-size: 14px; padding: 4px 0; color: var(--muted); }
  summary:hover { color: var(--ink); }

  /* ---- การ์ดเมื่อคลิก ---- */
  #card { right: 12px; bottom: 28px; width: 372px; max-height: calc(100% - 190px); overflow: auto; padding: 16px 18px; display: none; }
  #card.open { display: block; }
  #card .close { position: absolute; top: 8px; right: 8px; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; padding: 6px; }
  #cPlace { font-size: 14px; color: var(--muted); padding-right: 28px; margin-bottom: 4px; }
  .readout { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start; }
  .num { font: 700 44px/1 var(--head); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .num small { font: 500 15px/1 var(--body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .cls { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; margin: 8px 0 6px; }
  .cls i { width: 12px; height: 12px; border-radius: 2px; }
  #cExpl { font-size: 14.5px; margin: 0; }
  .warn { font-size: 13.5px; margin: 8px 0 0; padding: 6px 9px; background: var(--wash); border-left: 3px solid var(--muted); }
  .gauge { width: 58px; }
  .gauge svg { display: block; overflow: visible; }
  .gauge .drop { transition: height .7s cubic-bezier(.2, .7, .2, 1); }
  @media (prefers-reduced-motion: reduce) { .gauge .drop { transition: none; } }
  .gauge figcaption { font: 600 13px/1.2 var(--head); text-align: center; margin-top: 4px; color: var(--staff); font-variant-numeric: tabular-nums; }

  .block { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .block h3 { font: 600 14.5px/1.3 var(--head); margin: 0 0 6px; }
  .why { font-size: 14px; margin: 0 0 8px; }
  .bars { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; font-size: 13px; color: var(--muted); }
  .bars .bar { height: 6px; background: var(--wash); border-radius: 3px; overflow: hidden; }
  .bars .bar span { display: block; height: 100%; background: var(--ink); }
  dl.facts { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 0; font-size: 13.5px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
  #card canvas { width: 100% !important; height: 180px !important; }

  /* ---- กล่องเกี่ยวกับข้อมูล ---- */
  #about { position: fixed; inset: 0; background: rgba(18, 26, 28, .5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #about.open { display: flex; }
  #about .box { max-width: 660px; max-height: 88vh; overflow: auto; background: var(--paper); color: var(--ink); border-radius: 8px; padding: 22px 26px; box-shadow: var(--shadow); }
  #about h3 { margin: 0 0 8px; font: 600 21px/1.25 var(--head); }
  #about h4 { margin: 18px 0 4px; font: 600 15.5px/1.3 var(--head); }
  #about p, #about li { font-size: 14.5px; max-width: 68ch; }
  #about ul { padding-left: 20px; margin: 4px 0; }
  #about a { color: var(--ink); text-decoration-color: var(--staff); text-underline-offset: 3px; }
  #about small { color: var(--muted); }
  #about .close-row { text-align: right; margin: 16px 0 0; }
  #about .btn { border: 1.5px solid var(--ink); background: none; border-radius: 6px; padding: 6px 16px; cursor: pointer; }

  #toggle { display: none; position: absolute; top: 12px; left: 12px; z-index: 3; padding: 8px 14px; border: 1px solid var(--rule); cursor: pointer; font-weight: 500; }
  .maplibregl-ctrl-group { border-radius: 6px; }

  @media (max-width: 700px) {
    #side { width: auto; right: 12px; top: 58px; max-height: 62%; }
    #side.hidden { display: none; }
    #toggle { display: block; }
    h1 { font-size: 21px; }
    #card { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 60%; }
    .num { font-size: 38px; }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="map"></div>
<button id="toggle" class="panel" data-i18n="menu">ค้นหาและชั้นข้อมูล</button>

<aside id="side" class="panel">
  <script>if (matchMedia('(max-width: 700px)').matches) document.currentScript.parentElement.classList.add('hidden');</script>
  <div class="topline">
    <span class="links"><button class="link" id="aboutBtn" data-i18n="about">วิธีวัดและข้อจำกัด</button><button class="link" id="lang">English</button></span>
  </div>
  <h1 data-i18n="title">แผ่นดินตรงบ้านคุณทรุดลงปีละเท่าไร</h1>
  <p class="lede" id="lede"></p>

  <form id="search" role="search" autocomplete="off">
    <input id="q" type="search" data-i18n-ph="searchPh" placeholder="ค้นหาที่อยู่ ถนน หรือเขต" aria-label="search">
    <button type="submit" data-i18n="searchBtn">ค้นหา</button>
  </form>
  <ul id="results" hidden></ul>

  <div class="seg" role="group" aria-label="theme">
    <button id="m-sub" aria-pressed="true" data-i18n="mSub">อัตราการทรุด</button>
    <button id="m-risk" aria-pressed="false" data-i18n="mRisk" hidden>ความเสี่ยง</button>
    <button id="m-slr" aria-pressed="false" data-i18n="mSlr" hidden>น้ำทะเล</button>
  </div>
  <div id="riskCtl" hidden>
    <div class="seg seg4" role="group" aria-label="risk component">
      <button data-rk="risk" aria-pressed="true" data-i18n="rkRisk">รวม</button>
      <button data-rk="H" aria-pressed="false" data-i18n="rkH">ภัย</button>
      <button data-rk="E" aria-pressed="false" data-i18n="rkE">การสัมผัส</button>
      <button data-rk="V" aria-pressed="false" data-i18n="rkV">เปราะบาง</button>
    </div>
  </div>
  <div id="slrCtl" hidden>
    <div class="ctl-l" data-i18n="cYear">ปี</div>
    <div class="seg" role="group" aria-label="year">
      <button data-yr="2026" aria-pressed="false">ปัจจุบัน</button>
      <button data-yr="2050" aria-pressed="true">2593</button>
      <button data-yr="2100" aria-pressed="false">2643</button>
    </div>
    <div class="ctl-l" data-i18n="cSsp">ฉากทัศน์ภูมิอากาศ</div>
    <div class="seg" role="group" aria-label="scenario">
      <button data-ssp="ssp245" aria-pressed="true">SSP2-4.5</button>
      <button data-ssp="ssp585" aria-pressed="false">SSP5-8.5</button>
    </div>
    <div class="ctl-l" data-i18n="cSub">การทรุด</div>
    <div class="seg" role="group" aria-label="subsidence">
      <button data-sub="sub" aria-pressed="true" data-i18n="cSubY">ทรุดต่อ</button>
      <button data-sub="nosub" aria-pressed="false" data-i18n="cSubN">หยุดทรุดวันนี้</button>
    </div>
    <div class="ctl-l" data-i18n="cDef">คันกั้นน้ำ</div>
    <div class="seg" role="group" aria-label="dikes">
      <button data-def="def" aria-pressed="true" data-i18n="cDefY">มีคัน</button>
      <button data-def="undef" aria-pressed="false" data-i18n="cDefN">ไม่มีคัน</button>
    </div>
  </div>
  <p class="scale-t" id="scaleT"></p>
  <div id="legend"></div>

  <div class="flood-row" id="floodRow" hidden>
    <label class="chk"><input type="checkbox" id="l-flood"> <span class="sw" style="background:var(--flood)"></span> <span data-i18n="lFlood">น้ำท่วม</span></label>
  </div>
  <details>
    <summary data-i18n="more">ชั้นข้อมูลอื่น</summary>
    <label class="chk" id="gfmRow" hidden><input type="checkbox" id="l-gfm"> <span class="sw" style="background:var(--gfm)"></span> <span data-i18n="lGfm">GFM</span></label>
    <label class="chk"><input type="checkbox" id="l-bld" checked> <span data-i18n="lBld">อาคาร 3 มิติ</span></label>
    <label class="chk"><input type="checkbox" id="l-rail" checked> <span data-i18n="lRail">แนวราง</span></label>
    <label class="chk"><input type="checkbox" id="l-dist" checked> <span data-i18n="lDist">ขอบเขต</span></label>
    <label class="chk"><input type="checkbox" id="l-lab" checked> <span data-i18n="lLab">ป้ายจุดที่ทรุดมาก</span></label>
  </details>
</aside>

<section id="card" class="panel" aria-live="polite">
  <button class="close" id="cardClose" aria-label="close">×</button>
  <div id="cPlace"></div>
  <div id="cBody"></div>
</section>

<div id="about" role="dialog" aria-modal="true">
  <div class="box" id="aboutBox"></div>
</div>

<script>
const I18N = {
  th: {
    menu: 'ค้นหาและชั้นข้อมูล', about: 'วิธีวัดและข้อจำกัด', where: 'กรุงเทพฯ สมุทรปราการ สมุทรสาคร',
    title: 'แผ่นดินตรงบ้านคุณทรุดลงปีละเท่าไร',
    lede: 'ดาวเทียม Sentinel-1 วัดความสูงของพื้นดินในกรุงเทพฯ สมุทรปราการ และสมุทรสาคร ราวทุก 12 วัน ตั้งแต่ เม.ย. 2564 ถึง ต.ค. 2569 พื้นที่ทรุดเร็วที่สุดอยู่ที่<b>บ้านแพ้ว ปีละ 2.3 ซม.</b> ส่วนใจกลางกรุงเทพฯ ทรุดราวปีละ 3–4 มม.',
    searchPh: 'ค้นหาที่อยู่ ถนน หรือเขต', searchBtn: 'ค้นหา', searching: 'กำลังค้นหา…', noResult: 'ไม่พบสถานที่นี้ในสามจังหวัด ลองพิมพ์ชื่อถนนหรือเขต',
    district: 'เขต/อำเภอ',
    mSub: 'อัตราการทรุด', mRisk: 'ความเสี่ยง', mSlr: 'น้ำทะเล',
    rkRisk: 'รวม', rkH: 'ภัย', rkE: 'การสัมผัส', rkV: 'เปราะบาง',
    rkName: { risk: 'ความเสี่ยง', H: 'ภัย', E: 'การสัมผัส', V: 'ความเปราะบาง' },
    rkScale: { risk: 'ความเสี่ยงเทียบกันทั้งพื้นที่ แบ่ง 5 ระดับ ระดับละ 20% ของพื้นที่ที่มีคนหรืออาคาร', H: 'ภัย: พื้นดินทรุดเร็ว ทรุดไม่เท่ากัน และมีน้ำท่วม (0–1)', E: 'การสัมผัส: คน อาคาร และสถานที่สำคัญที่อยู่ในพื้นที่ (0–1)', V: 'ความเปราะบาง: กลุ่มคนและอาคารที่รับมือได้ยาก (0–1)' },
    rkLo: 'ต่ำ (0)', rkHi: 'สูง (1)',
    rkInd: {
      risk: [['ภัย × การสัมผัส × ความเปราะบาง', 'ทั้งสามส่วนต้องสูงพร้อมกัน ความเสี่ยงจึงสูง ถ้าส่วนใดเป็น 0 ความเสี่ยงเป็น 0']],
      H: [['อัตราทรุดแนวดิ่ง (มม./ปี)', 'InSAR Sentinel-1 เม.ย. 2564 – ต.ค. 2569 (งานนี้)'],

    <p>This map shows how fast the ground surface sinks on average each year, measured from Sentinel-1 satellite radar on ascending and descending orbits (157 acquisitions each) between April 2021 and October 2026, using SBAS InSAR at about 80 m resolution.</p>
    <h4>How to read it</h4>
    <ul><li>The ± is an approximate uncertainty: the statistical error combined with half the difference between the two satellite orbits.</li>
    <li>Values are millimetres per year. 15 mm a year means about 15 cm lower after 10 years if the rate continues.</li>

    <p>Risk = <b>hazard × exposure × vulnerability</b> (UNDRR framework), computed for every 100 × 100 m cell. Each part is scaled 0–1 across the study area and cells with people or buildings are split into 5 equal classes (20% each), so it shows <b>relative risk</b>, not a probability of damage.</p>
    <ul><li><b>Hazard</b>: sinking rate, uneven sinking that can affect buildings (angular distortion), flooding nearby on 21 Oct 2026</li>
    <li><b>People and buildings</b>: people and building area in the cell, and schools, hospitals, fire and police stations and rail stations within 500 m</li>
    <li><b>Vulnerability</b> (within 500 m): share aged 65+, share under 5 (WorldPop 2025), low buildings up to 6 m (houses often on short piles), and distance to the nearest hospital</li></ul>
    <h4>Flooding from the sea: today</h4>
    <p>Uses a Sentinel-2 image (5 Jan 2026, water about +2.25 m, above the usual yearly peak) taken at high tide, chosen from the water level at the Chao Phraya mouth at overpass time in the dry, nearly cloud-free season. Water is detected with the MNDWI index and compared with a low-tide image (1 Dec 2025, +0.03 m). Land that is wet at high tide but dry at low tide, with surface water connected to the sea within 5 km, is where the sea actually reached: only about 6 km² along the Samut Sakhon, Phra Samut Chedi and Bang Khun Thian shore; almost the whole coastal belt is ponds that hold water anyway. Newly wet spots far inland (about 65 km²) are fields or ponds being filled and are not counted. Sentinel-2 and Landsat on 15 Jan 2025 give 2–4 km², consistent with this. Water under mangroves or trees is not visible, and depth is not measured.</p>
    <h4>Future flooding from the sea</h4>
    <p>Simulated with the 2D hydrodynamic model SFINCS (Deltares) on a 100 m grid. Sea water enters from the Gulf of Thailand following real 10-minute water levels (tide + storm surge, Copernicus GTSM) during the highest tide of 2024 (24 June, +2.0 m at the river mouth), plus IPCC AR6 sea-level rise (median, version without land motion). Ground height comes from DeltaDTM converted to height above sea level (+1.08 m from EGM2008), minus accumulated sinking at the InSAR rate. Water must flow through connected low ground and is stopped by higher land or dikes.</p>

    <p>The Copernicus GFM layer (pink) is the automatic flood map of the Copernicus Emergency Management Service from the same image with a different method. GFM maps 45 km² in the three provinces, our map 100 km²; 84% of the GFM area lies inside ours and the most-flooded districts rank the same.</p>

function tideAt(lng, lat) {
  if (!tideGrid) return null;

}

function gaugeSVG(cm) {

  let marks = '';
  for (let i = 0; i < max; i++) marks += i % 2 ? '' : `<rect x="0" y="${i * px}" width="9" height="${px}" fill="var(--ink)" opacity=".85"/>`;
  for (let i = 0; i <= max; i += 5) marks += `<line x1="0" x2="${i % 10 ? 13 : 17}" y1="${i * px}" y2="${i * px}" stroke="var(--ink)" stroke-width="1"/>`
    + (i % 10 || i === 0 ? '' : `<text x="22" y="${i * px + 4}" font-size="10" fill="var(--muted)" font-family="Chakra Petch">${i}</text>`);
  const step = `<line x1="-4" x2="38" y1="${STEP_CM * px}" y2="${STEP_CM * px}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  return `<svg width="40" height="${H}" viewBox="0 0 40 ${H}" role="img" aria-label="${fmt(cm, 0)} cm">
    <rect x="0" y="0" width="17" height="${H}" fill="var(--paper)" stroke="var(--rule)"/>${marks}

    <line x1="-6" x2="24" y1="0" y2="0" stroke="var(--ink)" stroke-width="2"/>${step}</svg>`;
}

function drawChart(d) {

  const b = ok.reduce((a, i) => a + (x[i] - mx) * (s[i] - my), 0) / ok.reduce((a, i) => a + (x[i] - mx) ** 2, 0);

      { label: T('monthly'), data: s, showLine: false, pointRadius: 1.8, backgroundColor: muted + '88', borderColor: muted + '88' },
      { label: T('trend'), data: trend, pointRadius: 0, borderColor: staff, borderWidth: 2.5 },

    animation: false, maintainAspectRatio: false,

    scales: { x: { ticks: { color: muted, maxTicksLimit: 6, font: { size: 11, family: 'Chakra Petch' } }, grid: { display: false }, border: { color: rule } },

        grid: { color: rule }, border: { display: false } } } } });
}

    map.addSource('ss-flood', { type: 'image', url: 'flood.png', coordinates: meta.flood.image });
    map.addLayer({ id: 'ss-flood', type: 'raster', source: 'ss-flood', layout: { visibility: 'none' }, paint: { 'raster-opacity': .9, 'raster-resampling': 'nearest' } }, firstSymbol);
    $('floodRow').hidden = false;
  }
  if (meta.gfm) {
    map.addSource('ss-gfm', { type: 'image', url: 'gfm.png', coordinates: meta.gfm.image });
    map.addLayer({ id: 'ss-gfm', type: 'raster', source: 'ss-gfm', layout: { visibility: 'none' }, paint: { 'raster-opacity': .9, 'raster-resampling': 'nearest' } }, firstSymbol);
    $('gfmRow').hidden = false;
  }
  map.addSource('ss-dist', { type: 'geojson', data: districtsGeo });
  map.addLayer({ id: 'ss-dist', type: 'line', source: 'ss-dist',
    paint: { 'line-color': '#1b2629', 'line-opacity': .45, 'line-width': ['interpolate', ['linear'], ['zoom'], 9, .5, 14, 1.3] } }, firstSymbol);
  meta.buildings.forEach((f, i) => {
    map.addSource(`ss-b${i}`, { type: 'vector', url: `pmtiles://${new URL(f, location.href)}` });
    map.addLayer({ id: `ss-bld${i}`, type: 'fill-extrusion', source: `ss-b${i}`, 'source-layer': 'buildings', minzoom: 13,
      paint: { 'fill-extrusion-color': colorExpr('c'), 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-opacity': .93 } });
  });
  map.addSource('ss-rail', { type: 'geojson', data: 'rail.geojson' });
  map.addLayer({ id: 'ss-rail-case', type: 'line', source: 'ss-rail', paint: { 'line-color': '#1b2629', 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 2.6, 15, 8] } });
  map.addLayer({ id: 'ss-rail', type: 'line', source: 'ss-rail', paint: { 'line-color': colorExpr('c'), 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 1.4, 15, 5] } });
  // ป้าย 6 เขตที่ทรุดเร็วที่สุด เขียนลงบนแผนที่ตรง ๆ
  map.addLayer({ id: 'ss-lab', type: 'symbol', source: 'ss-dist', maxzoom: 12.5, filter: ['<=', ['get', 'rank'], 6],
    layout: { 'text-field': labelExpr(), 'text-font': font, 'text-size': 13, 'text-line-height': 1.25, 'text-padding': 4 },
    paint: { 'text-color': '#1b2629', 'text-halo-color': '#ffffff', 'text-halo-width': 1.6 } });
  applyLang();

  map.on('click', e => {
    const { lng, lat } = e.lngLat;
    const layers = [...meta.buildings.map((_, i) => `ss-bld${i}`), 'ss-rail'].filter(l => map.getLayoutProperty(l, 'visibility') !== 'none');
    const f = map.queryRenderedFeatures(e.point, { layers })[0];
    const district = districtAt(lng, lat), lnglat = [lng, lat];
    $('results').hidden = true;
    if (f && f.layer.id.startsWith('ss-bld')) {
      const p = f.properties;
      showCard({ v: p.v ?? null, h: p.h, district: p.d !== undefined && p.d !== null ? districtsGeo.features[p.d].properties : district, lnglat });
    } else if (f && f.layer.id === 'ss-rail') {
      showCard({ v: f.properties.v ?? null, rail: true, district, lnglat });
    } else {
      showCard({ v: gridValue(lng, lat), district, lnglat });
    }
    placeMarker(lng, lat);
  });
  map.on('mousemove', e => {
    const layers = [...meta.buildings.map((_, i) => `ss-bld${i}`), 'ss-rail'];
    map.getCanvas().style.cursor = map.queryRenderedFeatures(e.point, { layers }).length ? 'pointer' : '';
  });

  const vis = (ids, on) => ids.forEach(id => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'));
  $('m-sub').onclick = () => setMode('sub');
  $('m-risk').onclick = () => setMode('risk');
  $('m-slr').onclick = () => setMode('slr');
  const pick = (attr, set) => document.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = () => {
    set(b.dataset[attr]); document.querySelectorAll(`[data-${attr}]`).forEach(x => x.setAttribute('aria-pressed', x === b)); showFlood(); });
  document.querySelectorAll('[data-rk]').forEach(b => b.onclick = () => {
    riskPart = b.dataset.rk; document.querySelectorAll('[data-rk]').forEach(x => x.setAttribute('aria-pressed', x === b));
    map.getSource('ss-risk').updateImage({ url: riskPart === 'risk' ? 'risk.png' : `risk_${riskPart}.png?v=${meta.v}`, coordinates: meta.risk.image });
    $('scaleT').textContent = T('rkScale')[riskPart]; $('legend').innerHTML = legendHTML(); if (last) showCard(last); });
  pick('yr', v => slrYear = +v); pick('ssp', v => ssp = v); pick('sub', v => subOn = v); pick('def', v => defOn = v);
  $('l-bld').onchange = e => vis(meta.buildings.map((_, i) => `ss-bld${i}`), e.target.checked);
  $('l-rail').onchange = e => vis(['ss-rail', 'ss-rail-case'], e.target.checked);
  $('l-dist').onchange = e => vis(['ss-dist'], e.target.checked);
  $('l-lab').onchange = e => vis(['ss-lab'], e.target.checked);
  $('l-flood').onchange = e => vis(['ss-flood'], e.target.checked);
  $('l-gfm').onchange = e => vis(['ss-gfm'], e.target.checked);
});

map.on('zoomend', () => { if (map.getZoom() >= 13 && map.getPitch() < 20) map.easeTo({ pitch: 50, duration: 600 }); });
$('lang').onclick = () => { lang = lang === 'th' ? 'en' : 'th'; applyLang(); };
$('aboutBtn').onclick = () => $('about').classList.add('open');
$('about').onclick = e => { if (e.target.id === 'about') $('about').classList.remove('open'); };
$('cardClose').onclick = () => { $('card').classList.remove('open'); last = null; marker?.remove(); };
$('toggle').onclick = () => $('side').classList.toggle('hidden');
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('about').classList.remove('open'); $('card').classList.remove('open'); $('results').hidden = true; } });
</script>
</body>
</html>
